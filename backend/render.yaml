services:
  - type: web
    name: dastyar-trade-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: SECRET_KEY
        generateValue: true          # Render یک مقدار تصادفی امن می‌سازد
      - key: DATABASE_PATH
        value: /data/dastyar.db      # روی Volume پایدار ذخیره می‌شود
      - key: ALLOWED_ORIGINS
        value: >-
          https://mapragpse2022-source.github.io,
          http://localhost:8080,
          http://127.0.0.1:8080
